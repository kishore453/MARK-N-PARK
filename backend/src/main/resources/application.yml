server:
  port: ${PORT:8080}

spring:
  application:
    name: marknpark-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/marknpark}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET:supersecretjwtkeythatisminimum256bitslongformarknparksecurityplatform2026!}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in ms

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:secret_placeholder}

cloudinary:
  url: ${CLOUDINARY_URL:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

logging:
  level:
    root: INFO
    com.marknpark: DEBUG
    org.springframework.security: INFO
